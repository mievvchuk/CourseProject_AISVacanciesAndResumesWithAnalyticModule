name: .NET CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AisVacanciesAndResumes.sln

      - name: Build
        run: dotnet build AisVacanciesAndResumes.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AisVacanciesAndResumes.sln --configuration Release --no-build --verbosity normal
